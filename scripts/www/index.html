  saveActive(true);
  applyModeUI();
  showToast("已切换到个人本地模式");
});

tabModeTeam.addEventListener("click", function(){
  if(currentMode === "team") return;
  currentMode = "team";
  saveActive(true);
  applyModeUI();
  showToast("已切换到小队联机模式");
  if(activeSquad) pullLatestFromRoom(true);
});

function packStatePayload(includeRoom, store, withImgs){
  store = store || teamData;
  var payload = {
    v: 3,
    t: store.updatedAt || Date.now(),
    s: clientId,
    rm: includeRoom ? (store.roomCode || "") : undefined,
    c: store.allCats,
    sc: store.subCatsMap,
    si: withImgs ? (store.subImgs || {}) : undefined,
    r: store.resources.map(function(x){
      return {
        id: x.id, name: x.name, cat: x.cat, subcat: x.subcat || "", kind: x.kind,
        base: x.base, early: x.early, late: x.late,
        loop: x.loop, loops: x.loops, open: x.open,
        starts: x.starts, customEnd: x.customEnd
      };
    })
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}

function decodeToken(rawInput){
  try{
    var clean = rawInput.trim();
    var tokenMatch = clean.match(/CZMF-([A-Za-z0-9+/=]+)/);
    if(tokenMatch){
      clean = tokenMatch[1];
    }else if(clean.indexOf("CZMF-") === 0){
      clean = clean.slice(5);
    }
    var obj = JSON.parse(decodeURIComponent(escape(atob(clean))));
    if(!obj) return null;
    if(!Array.isArray(obj.r) && !(obj.img && typeof obj.img.k === "string")) return null;
    return obj;
  }catch(e){ return null; }
}

function applyObjToStore(obj, store){
  if(Array.isArray(obj.c)){
    store.allCats = obj.c.filter(function(c){ return typeof c === "string" && c.trim() && c !== "全部"; });
  }
  if(obj.sc && typeof obj.sc === "object") store.subCatsMap = obj.sc;
  store.resources = normalizeResources(obj.r);
  if(obj.si && typeof obj.si === "object") store.subImgs = cleanImgs(obj.si);
  if(!store.subImgs) store.subImgs = {};
  ensureSubCatsRegistered(store);
  store.updatedAt = obj.t || Date.now();
  loopCache = {};
}

/* 小队实时同步：把消息应用到指定小队的数据里 */
function unpackAndApplyState(rawInput, isLiveRoom, target, code){
  try{
    target = target || teamData;
    var obj = decodeToken(rawInput);
    if(!obj) return false;
    if(isLiveRoom && obj.s === clientId) return false;

    var isActive = (target === teamData);
    if(obj.img){
      if(!target.subImgs) target.subImgs = {};
      var dImg = obj.img.d;
      if(typeof dImg === "string" && dImg.indexOf("data:image/") === 0 && dImg.length < 40000) target.subImgs[obj.img.k] = dImg;
      else delete target.subImgs[obj.img.k];
      if(isActive && currentMode === "team"){
        saveActive(true);
        if(!subGuideEl.hidden) renderSubGuide();
      }else{
        saveSquads();
      }
      return true;
    }

    applyObjToStore(obj, target);

    if(isActive && currentMode === "team"){
      saveActive(true);
      renderTabs();
      render();
    }else{
      saveSquads();
    }
    if(isActive){
      var nowStr = p2(new Date().getHours()) + ":" + p2(new Date().getMinutes()) + ":" + p2(new Date().getSeconds());
      $("#lastSyncInfo").textContent = "已同步小队最新时间 (" + nowStr + ")";
    }
    return true;
  }catch(e){
    return false;
  }
}

function topicForRoom(code){
  var h1 = 0x811c9dc5, h2 = 0x1b873593;
  var str = "czmf_private_room_2026_" + code.trim();
  for(var i = 0; i < str.length; i++){
    var c = str.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 0x01000193);
    h2 ^= c; h2 = Math.imul(h2, 0x85ebca6b);
  }
  return "czmf_team_" + (h1 >>> 0).toString(36) + "_" + (h2 >>> 0).toString(36);
}

function renderSquadList(){
  var box = $("#squadList");
  if(!box) return;
  box.innerHTML = "";
  squads.forEach(function(q){
    var chip = document.createElement("span");
    chip.className = "squad-chip" + (q.code === activeSquad ? " on" : "");
    chip.appendChild(document.createTextNode(q.code));
    var x = document.createElement("button");
    x.type = "button"; x.className = "sq-x"; x.textContent = "×"; x.title = "断开这个小队";
    x.addEventListener("click", function(ev){ ev.stopPropagation(); disconnectRoom(false, q.code); });
    chip.appendChild(x);
    chip.addEventListener("click", function(){ switchSquad(q.code); });
    box.appendChild(chip);
  });
}

function updateRoomUI(){
  var dot = $("#syncDot"), stText = $("#syncStatusText"),
      pullBtn = $("#pullNowBtn"), pushBtn = $("#pushNowBtn"), leaveBtn = $("#leaveRoomBtn");
  renderSquadList();
  if(!activeSquad){
    dot.className = "dot";
    stText.textContent = "未连接小队";
    pullBtn.hidden = true;
    pushBtn.hidden = true;
    leaveBtn.hidden = true;
    return;
  }
  pullBtn.hidden = false;
  pushBtn.hidden = false;
  leaveBtn.hidden = false;
  var c = conns[activeSquad];
  var suffix = "（" + squads.length + "/" + MAX_SQUADS + "）";
  if(c && c.status === "live"){
    dot.className = "dot live";
    stText.textContent = (c.msg || ("已连：" + activeSquad)) + suffix;
  }else{
    dot.className = "dot wait";
    stText.textContent = ((c && c.msg) || ("连接中：" + activeSquad)) + suffix;
  }
}

function pullLatestFromRoom(silent, code){
  code = code || activeSquad;
  var sq = squadByCode(code);
  if(!sq) return;
  var topic = topicForRoom(code);
  fetch("https://ntfy.sh/" + topic + "/json?poll=1&since=12h")
    .then(function(res){ return res.text(); })
    .then(function(txt){
      var lines = txt.trim().split("\n");
      var stateDone = false, seenImg = {};
      for(var i = lines.length - 1; i >= 0; i--){
        if(!lines[i]) continue;
        try{
          var item = JSON.parse(lines[i]);
          if(item && item.event === "message" && item.message){
            var po = decodeToken(item.message);
            if(!po) continue;
            if(po.img){
              if(seenImg[po.img.k]) continue;
              seenImg[po.img.k] = 1;
              unpackAndApplyState(item.message, false, sq.data, code);
            }else if(!stateDone){
              stateDone = true;
              if(unpackAndApplyState(item.message, false, sq.data, code)){
                if(!silent) showToast("已拉取小队最新刷新表");
              }
            }
          }
        }catch(e){}
      }
    }).catch(function(){});
}

function closeConn(code){
  var c = conns[code];
  if(!c) return;
  if(c.es){ try{ c.es.close(); }catch(e){} }
  if(c.bc){ try{ c.bc.close(); }catch(e){} }
  delete conns[code];
}

function openConn(code){
  closeConn(code);
  var sq = squadByCode(code);
  if(!sq) return;
  var c = conns[code] = {es: null, bc: null, status: "wait", msg: ""};
  var topic = topicForRoom(code);
  try{
    if("BroadcastChannel" in window){
      c.bc = new BroadcastChannel(topic);
      c.bc.onmessage = function(ev){
        if(ev.data && unpackAndApplyState(ev.data, true, sq.data, code)){
          if(currentMode === "team" && code === activeSquad) showToast("队友更新了刷新时间");
        }
      };
    }
  }catch(e){}

  try{
    c.es = new EventSource("https://ntfy.sh/" + topic + "/sse");
    c.es.onopen = function(){
      c.status = "live"; c.msg = "";
      updateRoomUI();
      if(code === activeSquad) $("#lastSyncInfo").textContent = "小队频道在线";
    };
    c.es.onmessage = function(ev){
      try{
        var data = JSON.parse(ev.data);
        if(data && data.event === "message" && data.message){
          if(unpackAndApplyState(data.message, true, sq.data, code)){
            if(currentMode === "team" && code === activeSquad) showToast("已同步队友的操作");
          }
        }
      }catch(err){}
    };
    c.es.onerror = function(){
      c.status = "wait"; c.msg = "重连中...";
      updateRoomUI();
    };
  }catch(e){
    c.status = "wait"; c.msg = "请用口令码同步";
  }
}

function switchSquad(code){
  var sq = squadByCode(code);
  if(!sq) return;
  if(currentMode === "team" && activeSquad){
    teamData.tab = activeTab;
    teamData.subTab = activeSubTab;
  }
  activeSquad = code;
  teamData = sq.data;
  teamData.roomCode = code;
  $("#roomCodeInp").value = code;
  saveSquads();
  if(currentMode === "team"){
    activeTab = teamData.tab;
    activeSubTab = teamData.subTab;
    if(tabsList().indexOf(activeTab) < 0){ activeTab = "全部"; activeSubTab = ""; }
    renderTabs();
    render();
  }
  updateRoomUI();
}

function connectRoom(code, skipInitialPull){
  code = (code || "").trim();
  if(!code){ showToast("请先输入小队暗号"); return; }
  var exist = squadByCode(code);
  if(exist){
    if(!conns[code]) openConn(code);
    switchSquad(code);
    if(!skipInitialPull) pullLatestFromRoom(true, code);
    showToast("已切换到小队：" + code);
    return;
  }
  if(squads.length >= MAX_SQUADS){
    showToast("最多同时加入" + MAX_SQUADS + "个小队，请先断开一个");
    return;
  }
  var data;
  if(squads.length === 0){
    data = teamData; // 第一个小队沿用当前小队页里已有的内容
  }else{
    data = normalizeStore({});
  }
  data.roomCode = code;
  squads.push({code: code, data: data});
  switchSquad(code);
  openConn(code);
  if(!skipInitialPull) pullLatestFromRoom(true, code);
}

function disconnectRoom(silent, code){
  code = code || activeSquad;
  var sq = squadByCode(code);
  if(!sq) return;
  closeConn(code);
  squads = squads.filter(function(q){ return q.code !== code; });
  if(code === activeSquad){
    if(squads.length){
      activeSquad = "";
      switchSquad(squads[0].code);
    }else{
      activeSquad = "";
      teamData = sq.data;
      teamData.roomCode = "";
      saveSquads();
      try{ localStorage.setItem(KEY_TEAM, JSON.stringify(teamData)); }catch(e){}
      if(currentMode === "team"){ renderTabs(); render(); }
    }
  }else{
    saveSquads();
  }
  updateRoomUI();
  $("#lastSyncInfo").textContent = squads.length ? "输入相同暗号即可同屏（最多同时加入5个小队）" : "未连接小队频道";
  if(!silent) showToast("已断开小队：" + code);
}

function broadcastChange(){
  if(currentMode !== "team" || !activeSquad) return;
  var code = activeSquad, store = teamData;
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(function(){
    var packed = packStatePayload(true, store);
    var c = conns[code];
    if(c && c.bc){ try{ c.bc.postMessage(packed); }catch(e){} }
    var topic = topicForRoom(code);
    fetch("https://ntfy.sh/" + topic, { method: "POST", body: packed }).catch(function(){});
  }, 200);
}

$("#joinRoomBtn").addEventListener("click", function(){
  connectRoom($("#roomCodeInp").value, false);
});
$("#genRoomBtn").addEventListener("click", function(){
  if(squads.length >= MAX_SQUADS){ showToast("最多同时加入" + MAX_SQUADS + "个小队，请先断开一个"); return; }
  var rand = "cm" + Math.random().toString(36).slice(2, 7);

$("#leaveRoomBtn").addEventListener("click", function(){ disconnectRoom(false); });
$("#pullNowBtn").addEventListener("click", function(){ pullLatestFromRoom(false); });
$("#pushNowBtn").addEventListener("click", function(){

  pushAllImages();
  showToast("已推送给队友！");
});

function copyText(str, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(function(){ showToast(okMsg); }).catch(function(){ fallbackCopy(str, okMsg); });
  }else{
    fallbackCopy(str, okMsg);
  }
}
function fallbackCopy(str, okMsg){
  var ta = document.createElement("textarea");
  ta.value = str;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); showToast(okMsg); }catch(e){ showToast("复制失败"); }
  document.body.removeChild(ta);
}

$("#exportCodeBtn").addEventListener("click", function(){
  var token = "【创魔刷新表口令】复制整条消息到App导入即可同步我的本地计时器：CZMF-" + packStatePayload(false, localData, true);
  copyText(token, "已复制本地计时器口令码！发给别人粘贴即可");

$("#importCodeBtn").addEventListener("click", function(){

  $("#importCodeInp").value = "";

  }else{
    showToast("导入成功！已导入到本地计时器（切到“本地”查看）");
  }
});

document.addEventListener("pointerdown", function(){ unlockAudio(); }, {once: true});

/* ---------- 悬浮快记球与直接输入栏小窗（含上下自适应防越界定位） ---------- */
var fabBall = $("#fabBall");
var quickFloat = $("#quickFloat");
var qfModeTag = $("#qfModeTag");
var qfSmartInp = $("#qfSmartInp"), qfSmartSubmit = $("#qfSmartSubmit");

function syncQuickFloat(){
  if(!quickFloat) return;
  qfModeTag.textContent = currentMode === "team" ? "小队" : "本地";
  var list = currentResources();
  if(list.length > 0 && !byId(qfSelectedResId)){
    qfSelectedResId = list[0].id;
  }
}

$("#qfSmartEx").querySelectorAll(".chip").forEach(function(chip){
  chip.addEventListener("click", function(){
    qfSmartInp.value = (qfSmartInp.value + (chip.dataset.fill || "")).trimStart();
    qfSmartInp.focus();
  });
});

qfSmartSubmit.addEventListener("click", function(){
  triggerSmartInput(qfSmartInp);
});
qfSmartInp.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    triggerSmartInput(qfSmartInp);
  }
});

function positionQuickFloat(){
  if(!quickFloat || quickFloat.hidden) return;
  var ballRect = fabBall.getBoundingClientRect();
  var qfW = quickFloat.offsetWidth || 300;
  var qfH = quickFloat.offsetHeight || 168;
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var pad = 12;

  // 水平方向：靠近悬浮球所在侧，并严格限制在屏幕内
  var left;
  if(ballRect.left + ballRect.width / 2 < vw / 2){
    left = Math.max(pad, ballRect.left);
  }else{
    left = Math.min(vw - qfW - pad, ballRect.right - qfW);
  }
  left = Math.max(pad, Math.min(vw - qfW - pad, left));

  // 垂直方向：若悬浮球偏屏幕上半部分，弹窗向下展开；偏下半部分则向上展开，绝不遮挡顶部关闭按钮
  var top;
  if(ballRect.top < qfH + 24){
    top = ballRect.bottom + 10;
  }else{
    top = ballRect.top - qfH - 10;
  }
  top = Math.max(pad, Math.min(vh - qfH - pad, top));

  quickFloat.style.right = "auto";
  quickFloat.style.bottom = "auto";
  quickFloat.style.left = Math.round(left) + "px";
  quickFloat.style.top = Math.round(top) + "px";
}

function toggleQuickFloat(forceOpen){
  var willOpen = (typeof forceOpen === "boolean") ? forceOpen : quickFloat.hidden;
  quickFloat.hidden = !willOpen;
  fabBall.classList.toggle("open", willOpen);
  if(willOpen){
    syncQuickFloat();
    positionQuickFloat();
    setTimeout(function(){
      positionQuickFloat();
      qfSmartInp.focus();
    }, 20);
  }
}

$("#qfCloseBtn").addEventListener("click", function(){ toggleQuickFloat(false); });
window.addEventListener("resize", positionQuickFloat);

/* 悬浮球拖拽与点击判别（支持触摸与鼠标） */
(function initFabDrag(){
  var dragging = false, moved = false, startX = 0, startY = 0, origRight = 14, origBottom = 76;
  fabBall.addEventListener("pointerdown", function(e){
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    var rect = fabBall.getBoundingClientRect();
    origRight = window.innerWidth - rect.right;
    origBottom = window.innerHeight - rect.bottom;
    fabBall.setPointerCapture(e.pointerId);
  });
  fabBall.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if(!moved) return;
    var newRight = Math.min(window.innerWidth - 62, Math.max(10, origRight - dx));
    var newBottom = Math.min(window.innerHeight - 62, Math.max(12, origBottom - dy));
    fabBall.style.right = newRight + "px";
    fabBall.style.bottom = newBottom + "px";
    if(!quickFloat.hidden) positionQuickFloat();
  });
  fabBall.addEventListener("pointerup", function(e){
    if(!dragging) return;
    dragging = false;
    try{ fabBall.releasePointerCapture(e.pointerId); }catch(err){}
    if(!moved){
      toggleQuickFloat();
    }else{
      var rect = fabBall.getBoundingClientRect();
      var snapRight = (rect.left + rect.width / 2 < window.innerWidth / 2) ? (window.innerWidth - 62) : 14;
      fabBall.style.right = snapRight + "px";
      if(!quickFloat.hidden) positionQuickFloat();
    }
  });
})();

function resumeSync(){
  tick();
  squads.forEach(function(q){
    pullLatestFromRoom(true, q.code);
    var c = conns[q.code];
    if(!c || !c.es || c.es.readyState === 2) openConn(q.code);
  });
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) resumeSync(); });
window.addEventListener("focus", resumeSync);
window.addEventListener("pageshow", resumeSync);
window.addEventListener("online", resumeSync);
document.addEventListener("resume", resumeSync);

loadAll();
updateSoundBtn();
updateNotifyBtn();
applyModeUI();

squads.forEach(function(q){
  openConn(q.code);
  pullLatestFromRoom(true, q.code);
});
if(activeSquad) $("#roomCodeInp").value = activeSquad;
updateRoomUI();

var now0 = Date.now();
var alertOnLoad = false;
var initResList = currentResources();
for(var r = 0; r < initResList.length; r++){
  var any = false;
  for(var i = 0; i < ISLES; i++){
    var key0 = initResList[r].id + ":" + i;
    var eff0 = effectiveStart(initResList[r], i, now0);
    var st0 = eff0 ? isleStateAt(eff0, now0) : "idle";
    rowState[key0] = st0;
    if(eff0){
      var wb0 = key0 + ":" + eff0.start;
      if(st0 === "run" && (eff0.hasWin ? eff0.winStart : eff0.end) - now0 <= 300000) warned[wb0 + ":a"] = 1;
      if(st0 === "win" && eff0.end - now0 <= 300000) warned[wb0 + ":b"] = 1;
    }
    if(eff0) lastRound[key0] = eff0.round; else delete lastRound[key0];
    if(st0 === "due"){ any = true; alertOnLoad = true; }
  }
  if(any) initResList[r].open = true;
}
render();
booted = true;
tick();
if(alertOnLoad){
  setTimeout(function(){ beep(); lastBeepAt = Date.now(); }, 700);
}
setInterval(tick, 500);
})();
